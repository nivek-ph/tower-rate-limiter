<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Store result and failure mode flow</title>
  <desc id="desc">Valid Store usage is evaluated normally. Store errors and invalid zero usage follow StoreFailureMode Reject or Allow. Key and quota failures never fail open.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #24292f; font-size: 16px; }
      .small { font-size: 14px; fill: #57606a; }
      .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; rx: 10; }
      .decision { fill: #fff8c5; stroke: #9a6700; stroke-width: 2; }
      .success { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; rx: 10; }
      .reject { fill: #ffebe9; stroke: #cf222e; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .small { fill: #9da7b1; }
        .box { fill: #161b22; stroke: #8b949e; }
        .decision { fill: #3b2e00; stroke: #d29922; }
        .success { fill: #12261e; stroke: #3fb950; }
        .reject { fill: #30191c; stroke: #f85149; }
        .line { stroke: #8b949e; }
      }
    </style>
  </defs>

  <rect class="box" x="30" y="55" width="155" height="65"/>
  <text x="107" y="83" text-anchor="middle">Store result</text>
  <text class="small" x="107" y="105" text-anchor="middle">after increment</text>

  <path class="decision" d="M 300 35 L 410 87 L 300 139 L 190 87 Z"/>
  <text x="300" y="82" text-anchor="middle">Ok and used ≥ 1?</text>
  <text class="small" x="300" y="104" text-anchor="middle">valid Usage</text>
  <path class="line" d="M 185 87 H 190"/>

  <rect class="success" x="470" y="50" width="190" height="75"/>
  <text x="565" y="80" text-anchor="middle">evaluate quota</text>
  <text class="small" x="565" y="103" text-anchor="middle">Allowed or RateLimited</text>
  <path class="line" d="M 410 87 H 470"/>
  <text class="small" x="440" y="75" text-anchor="middle">yes</text>

  <path class="decision" d="M 300 205 L 425 265 L 300 325 L 175 265 Z"/>
  <text x="300" y="260" text-anchor="middle">StoreFailureMode</text>
  <text class="small" x="300" y="283" text-anchor="middle">error or invalid Usage</text>
  <path class="line" d="M 300 139 V 205"/>
  <text class="small" x="312" y="172">no</text>

  <rect class="reject" x="500" y="225" width="185" height="80"/>
  <text x="592" y="255" text-anchor="middle">Reject</text>
  <text class="small" x="592" y="279" text-anchor="middle">503 by default</text>
  <path class="line" d="M 425 265 H 500"/>

  <rect class="success" x="500" y="365" width="215" height="80"/>
  <text x="607" y="395" text-anchor="middle">Allow</text>
  <text class="small" x="607" y="419" text-anchor="middle">inner service, no metadata</text>
  <path class="line" d="M 350 304 C 410 350 450 405 500 405"/>

  <rect class="box" x="780" y="50" width="225" height="75"/>
  <text x="892" y="80" text-anchor="middle">Key / quota resolution</text>
  <text class="small" x="892" y="103" text-anchor="middle">before Store::increment</text>

  <rect class="reject" x="780" y="225" width="225" height="80"/>
  <text x="892" y="255" text-anchor="middle">Key / quota failure</text>
  <text class="small" x="892" y="279" text-anchor="middle">always reject</text>
  <path class="line" d="M 892 125 V 225"/>

  <text class="small" x="300" y="475" text-anchor="middle">Only Store-side failures consult StoreFailureMode.</text>
</svg>
