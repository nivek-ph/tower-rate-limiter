<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" role="img" aria-labelledby="title desc">
  <title id="title">Rate-limited request lifecycle</title>
  <desc id="desc">A request is optionally bypassed, otherwise its client key and limit are resolved, Store usage is incremented, and the request is either allowed or rate limited.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #24292f; font-size: 16px; }
      .small { font-size: 14px; fill: #57606a; }
      .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; rx: 10; }
      .decision { fill: #fff8c5; stroke: #9a6700; stroke-width: 2; }
      .success { fill: #dafbe1; stroke: #1a7f37; stroke-width: 2; rx: 10; }
      .reject { fill: #ffebe9; stroke: #cf222e; stroke-width: 2; rx: 10; }
      .line { fill: none; stroke: #57606a; stroke-width: 2; marker-end: url(#arrow); }
      @media (prefers-color-scheme: dark) {
        text { fill: #e6edf3; }
        .small { fill: #9da7b1; }
        .box { fill: #161b22; stroke: #8b949e; }
        .decision { fill: #3b2e00; stroke: #d29922; }
        .success { fill: #12261e; stroke: #3fb950; }
        .reject { fill: #30191c; stroke: #f85149; }
        .line { stroke: #8b949e; }
      }
    </style>
  </defs>

  <rect class="box" x="30" y="55" width="125" height="58"/>
  <text x="92" y="90" text-anchor="middle">Request</text>

  <path class="decision" d="M 245 40 L 330 84 L 245 128 L 160 84 Z"/>
  <text x="245" y="80" text-anchor="middle">skip predicate</text>
  <text class="small" x="245" y="101" text-anchor="middle">matches?</text>
  <path class="line" d="M 155 84 H 160"/>

  <rect class="box" x="365" y="55" width="145" height="58"/>
  <text x="437" y="80" text-anchor="middle">KeyExtractor</text>
  <text class="small" x="437" y="101" text-anchor="middle">client key</text>
  <path class="line" d="M 330 84 H 365"/>
  <text class="small" x="347" y="72" text-anchor="middle">no</text>

  <rect class="box" x="550" y="55" width="145" height="58"/>
  <text x="622" y="80" text-anchor="middle">LimitProvider</text>
  <text class="small" x="622" y="101" text-anchor="middle">quota limit</text>
  <path class="line" d="M 510 84 H 550"/>

  <rect class="box" x="735" y="55" width="155" height="58"/>
  <text x="812" y="80" text-anchor="middle">Store::increment</text>
  <text class="small" x="812" y="101" text-anchor="middle">atomic charge</text>
  <path class="line" d="M 695 84 H 735"/>

  <path class="decision" d="M 812 160 L 910 210 L 812 260 L 714 210 Z"/>
  <text x="812" y="206" text-anchor="middle">valid Usage?</text>
  <text class="small" x="812" y="228" text-anchor="middle">used ≥ 1</text>
  <path class="line" d="M 812 113 V 160"/>

  <path class="decision" d="M 812 310 L 920 365 L 812 420 L 704 365 Z"/>
  <text x="812" y="360" text-anchor="middle">used &gt; limit?</text>
  <text class="small" x="812" y="382" text-anchor="middle">rate-limit decision</text>
  <path class="line" d="M 812 260 V 310"/>
  <text class="small" x="826" y="289">yes</text>

  <rect class="reject" x="850" y="485" width="160" height="70"/>
  <text x="930" y="513" text-anchor="middle">429 response</text>
  <text class="small" x="930" y="536" text-anchor="middle">Retry-After + fields</text>
  <path class="line" d="M 866 392 C 930 420 930 450 930 485"/>
  <text class="small" x="918" y="429">yes</text>

  <rect class="success" x="530" y="485" width="190" height="70"/>
  <text x="625" y="513" text-anchor="middle">annotate request</text>
  <text class="small" x="625" y="536" text-anchor="middle">RateLimitContext</text>
  <path class="line" d="M 758 392 C 690 420 625 445 625 485"/>
  <text class="small" x="692" y="429">no</text>

  <rect class="success" x="275" y="485" width="175" height="70"/>
  <text x="362" y="513" text-anchor="middle">inner service</text>
  <text class="small" x="362" y="536" text-anchor="middle">already ready</text>
  <path class="line" d="M 530 520 H 450"/>

  <rect class="success" x="25" y="485" width="180" height="70"/>
  <text x="115" y="513" text-anchor="middle">inner response</text>
  <text class="small" x="115" y="536" text-anchor="middle">RateLimit fields</text>
  <path class="line" d="M 275 520 H 205"/>

  <rect class="success" x="175" y="210" width="175" height="70"/>
  <text x="262" y="238" text-anchor="middle">inner service</text>
  <text class="small" x="262" y="261" text-anchor="middle">no quota work</text>
  <path class="line" d="M 245 128 V 210"/>
  <text class="small" x="258" y="165">yes</text>

  <rect class="success" x="175" y="335" width="175" height="70"/>
  <text x="262" y="363" text-anchor="middle">inner response</text>
  <text class="small" x="262" y="386" text-anchor="middle">no rate-limit fields</text>
  <path class="line" d="M 262 280 V 335"/>

  <rect class="reject" x="475" y="205" width="175" height="70"/>
  <text x="562" y="233" text-anchor="middle">Store error path</text>
  <text class="small" x="562" y="256" text-anchor="middle">Reject or Allow</text>
  <path class="line" d="M 714 210 H 650"/>
  <text class="small" x="681" y="198" text-anchor="middle">no</text>

  <rect class="reject" x="475" y="335" width="175" height="70"/>
  <text x="562" y="363" text-anchor="middle">middleware error</text>
  <text class="small" x="562" y="386" text-anchor="middle">key or quota failure</text>
  <path class="line" d="M 437 113 V 150 C 437 178 505 178 530 205"/>
  <path class="line" d="M 622 113 V 160 C 622 180 600 188 585 205"/>
  <path class="line" d="M 562 275 V 335"/>
</svg>
